<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Prodigy verification code</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      width: 100%;
      padding: 24px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 12px;
    }
    .code-box {
      display: inline-block;
      font-size: 24px;
      letter-spacing: 6px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 6px;
      background-color: #111827;
      color: #ffffff;
      margin: 12px 0;
    }
    .meta {
      font-size: 12px;
      color: #666666;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <h1>Your Prodigy verification code</h1>

      <p>Hi {{username}},</p>

      <p>
        Here is your one time verification code for Prodigy.
        Enter this code in the app to continue.
      </p>

      <p class="code-box">
        {{code}}
      </p>

      <p class="meta">
        This code will expire shortly for security reasons.
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </div>
</body>
</html>
